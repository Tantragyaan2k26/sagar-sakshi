<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAGAR-SAKSHI Â· Static Dashboard Mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-dim": "#0c1419",
            "surface": "#0c1419",
            "surface-container-lowest": "#070f14",
            "surface-container-low": "#141d22",
            "surface-container": "#182126",
            "surface-container-high": "#232b31",
            "primary": "#80d2f1",
            "primary-container": "#63b6d4",
            "on-surface": "#dbe4eb",
            "outline-variant": "#3f484c"
          },
          fontFamily: {
            "mono": ["JetBrains Mono", "monospace"],
            "display": ["Space Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { margin: 0; padding: 0; background: #070f14; overflow: hidden; }
    iframe { border: none; width: 100%; height: calc(100vh - 44px); }
  </style>
</head>
<body class="text-on-surface antialiased font-mono">
  <!-- Top Switcher Bar -->
  <header class="h-11 bg-surface-container-lowest border-b border-outline-variant/40 flex items-center justify-between px-4 z-50">
    <div class="flex items-center gap-3">
      <span class="font-display font-bold text-primary tracking-wider text-sm flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base animate-pulse">radar</span>
        SAGAR-SAKSHI
      </span>
      <span class="text-outline-variant">|</span>
      <span class="text-[10px] text-on-surface/60 uppercase tracking-widest hidden sm:inline">Static UI mockups Â· sample data</span>
    </div>

    <!-- Screen Navigation Tabs -->
    <nav class="flex items-center gap-1 overflow-x-auto py-1">
      <button onclick="switchScreen('screen_01_command_overview/code.html', this)" class="screen-tab active px-2.5 py-1 rounded text-[11px] font-medium transition-all bg-primary/20 text-primary border border-primary/40">
        1. Command
      </button>
      <button onclick="switchScreen('screen_02_polarimetric_inspection/code.html', this)" class="screen-tab px-2.5 py-1 rounded text-[11px] font-medium transition-all text-on-surface/70 hover:text-primary hover:bg-surface-container-low border border-transparent">
        2. Polarimetric
      </button>
      <button onclick="switchScreen('screen_03_tactical_oceanographic_map/code.html', this)" class="screen-tab px-2.5 py-1 rounded text-[11px] font-medium transition-all text-on-surface/70 hover:text-primary hover:bg-surface-container-low border border-transparent">
        3. Tactical Map
      </button>
      <button onclick="switchScreen('screen_04_evidence_card_dossier/code.html', this)" class="screen-tab px-2.5 py-1 rounded text-[11px] font-medium transition-all text-on-surface/70 hover:text-primary hover:bg-surface-container-low border border-transparent">
        4. Evidence Dossier
      </button>
      <button onclick="switchScreen('screen_05_incident_drift_replay/code.html', this)" class="screen-tab px-2.5 py-1 rounded text-[11px] font-medium transition-all text-on-surface/70 hover:text-primary hover:bg-surface-container-low border border-transparent">
        5. Drift Replay
      </button>
      <button onclick="switchScreen('screen_06_coastal_vectors_map/code.html', this)" class="screen-tab px-2.5 py-1 rounded text-[11px] font-medium transition-all text-on-surface/70 hover:text-primary hover:bg-surface-container-low border border-transparent">
        6. Coastal Vectors
      </button>
    </nav>

    <div class="flex items-center gap-2">
      <a href="/frontend/" class="px-2 py-0.5 rounded border border-primary/50 text-[10px] text-primary hover:bg-primary/10">Open analysis demo</a>
      <a id="openRawBtn" href="screen_01_command_overview/code.html" target="_blank" class="px-2 py-0.5 rounded border border-outline-variant/50 text-[10px] text-on-surface/80 hover:text-primary hover:border-primary transition-all flex items-center gap-1">
        <span class="material-symbols-outlined text-xs">open_in_new</span>
        <span>Pop-out</span>
      </a>
    </div>
  </header>

  <!-- Screen Viewport Iframe -->
  <iframe id="mainViewport" src="screen_01_command_overview/code.html"></iframe>

  <script>
    function switchScreen(path, btn) {
      document.getElementById('mainViewport').src = path;
      document.getElementById('openRawBtn').href = path;
      document.querySelectorAll('.screen-tab').forEach(t => {
        t.className = 'screen-tab px-2.5 py-1 rounded text-[11px] font-medium transition-all text-on-surface/70 hover:text-primary hover:bg-surface-container-low border border-transparent';
      });
      btn.className = 'screen-tab active px-2.5 py-1 rounded text-[11px] font-medium transition-all bg-primary/20 text-primary border border-primary/40';
    }
  </script>
</body>
</html>
